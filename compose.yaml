name: friwatch

services:
  friwatch:
    image: ${FRIWATCH_IMAGE:-local/friwatch:dev}
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${FRIWATCH_PORT:-3000}:3000"
    volumes:
      - friwatch-data:/app/data
    environment:
      PLEX_SERVER: ${PLEX_SERVER:?Set PLEX_SERVER in .env or the stack environment}
      LISTEN_PORT: 3000
      DISABLE_TLS_VERIFY: ${DISABLE_TLS_VERIFY:-false}
      DISABLE_WATCH_TOGETHER: ${DISABLE_WATCH_TOGETHER:-false}
      DISABLE_REQUEST_LOGGING: ${DISABLE_REQUEST_LOGGING:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  friwatch-data:
    name: ${FRIWATCH_DATA_VOLUME:-friwatch-data}
